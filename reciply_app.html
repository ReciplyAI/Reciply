<!DOCTYPE html>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --green: #3B6D11; --green-light: #EAF3DE; --green-mid: #639922; --amber: #BA7517; --amber-light: #FAEEDA; --coral: #D85A30; }
  body { font-family: 'DM Sans', sans-serif; background: var(--color-background-tertiary, #f5f3ee); min-height: 100vh; }
  #app { max-width: 860px; margin: 0 auto; padding: 1.5rem; }
  .logo { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--green); letter-spacing: -0.5px; }
  .logo span { color: var(--amber); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0 2rem; }
  .user-pill { display: flex; align-items: center; gap: 8px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; padding: 6px 14px 6px 8px; font-size: 13px; color: var(--color-text-secondary); cursor: pointer; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: #C0DD97; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: #3B6D11; }
  .hero { text-align: center; padding: 2rem 0 2.5rem; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: 42px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; margin-bottom: 0.5rem; }
  .hero h1 em { color: var(--green-mid); font-style: italic; }
  .hero p { font-size: 15px; color: var(--color-text-secondary); margin-bottom: 2rem; }
  .input-wrap { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 16px; padding: 1.25rem 1.25rem 1rem; margin-bottom: 1rem; }
  .key-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .key-row input { flex: 1; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; padding: 9px 14px; font-size: 13px; color: var(--color-text-primary); font-family: 'DM Sans', sans-serif; outline: none; }
  .key-label { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
  .key-status { font-size: 12px; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
  .key-status.set { background: var(--green-light); color: var(--green); }
  .key-status.unset { background: var(--amber-light); color: var(--amber); }
  .ingredient-tags { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; margin-bottom: 12px; }
  .tag { background: var(--green-light); color: var(--green); font-size: 13px; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; }
  .tag button { background: none; border: none; color: var(--green); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .tag-placeholder { font-size: 13px; color: var(--color-text-tertiary); align-self: center; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 8px; padding: 9px 14px; font-size: 14px; color: var(--color-text-primary); font-family: 'DM Sans', sans-serif; outline: none; }
  .btn-add { background: var(--green-light); border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--green); cursor: pointer; }
  .btn-generate { width: 100%; margin-top: 12px; background: var(--green); border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 500; color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .btn-generate:hover { background: #27500A; }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
  .filter-row { display: flex; gap: 8px; margin: 1.5rem 0 1rem; flex-wrap: wrap; }
  .filter-btn { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; padding: 6px 16px; font-size: 13px; color: var(--color-text-secondary); cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .filter-btn.active { background: var(--amber-light); border-color: var(--amber); color: var(--amber); font-weight: 500; }
  .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
  .recipe-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.15s; }
  .recipe-card:hover { transform: translateY(-2px); }
  .recipe-img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .recipe-img-placeholder { width: 100%; height: 160px; background: linear-gradient(135deg, #EAF3DE, #C0DD97); display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .recipe-body { padding: 12px 14px 14px; }
  .recipe-tag { font-size: 11px; background: var(--amber-light); color: var(--amber); padding: 2px 8px; border-radius: 10px; display: inline-block; margin-bottom: 6px; }
  .recipe-title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px; line-height: 1.3; }
  .recipe-meta { font-size: 12px; color: var(--color-text-secondary); }
  .loading { text-align: center; padding: 3rem; color: var(--color-text-secondary); font-size: 15px; }
  .error-banner { background: #FCEBEB; border: 0.5px solid #F09595; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #A32D2D; margin-top: 10px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
  .modal { background: var(--color-background-primary); border-radius: 16px; max-width: 560px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 1.5rem; }
  .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 1rem; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--color-text-primary); margin-bottom: 0.5rem; }
  .modal-meta { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1rem; }
  .modal h3 { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin: 1rem 0 0.5rem; }
  .modal ul, .modal ol { padding-left: 1.25rem; font-size: 14px; color: var(--color-text-secondary); line-height: 1.8; }
  .modal-close { float: right; background: var(--color-background-secondary); border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--color-text-secondary); font-family: 'DM Sans', sans-serif; }
  .signin-screen { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .signin-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; padding: 2.5rem 2rem; max-width: 380px; width: 100%; text-align: center; }
  .signin-card .logo { font-size: 36px; display: block; margin-bottom: 0.25rem; }
  .signin-card p { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 2rem; }
  .signin-input { width: 100%; margin-bottom: 10px; padding: 11px 14px; border: 0.5px solid var(--color-border-secondary); border-radius: 10px; font-size: 14px; background: var(--color-background-secondary); color: var(--color-text-primary); font-family: 'DM Sans', sans-serif; outline: none; }
  .btn-signin { width: 100%; padding: 12px; background: var(--green); border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 4px; }
  .signin-switch { margin-top: 1rem; font-size: 13px; color: var(--color-text-secondary); }
  .signin-switch a { color: var(--green); cursor: pointer; }
  .err { color: var(--coral); font-size: 13px; margin-bottom: 8px; }
</style>

<div id="app">
  <h2 style="position:absolute;left:-9999px">Reciply — AI recipe generator</h2>
  <div id="root"></div>
</div>

<script>
const USERS_KEY = 'reciply_users';
const SESSION_KEY = 'reciply_session';
const KEY_STORAGE = 'reciply_gemini_key';

function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY)||'{}'); } catch { return {}; } }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); } catch { return null; } }
function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }

let state = {
  screen: getSession() ? 'main' : 'signin',
  user: getSession(),
  ingredients: [],
  recipes: [],
  loading: false,
  activeFilter: 'all',
  modal: null,
  error: '',
  authError: '',
  geminiKey: localStorage.getItem(KEY_STORAGE) || ''
};

const EMOJI = { breakfast:'🍳', lunch:'🥗', dinner:'🍝', dessert:'🍰', snack:'🥪', soup:'🍲', salad:'🥗', default:'🍽' };
function getEmoji(cat) {
  if (!cat) return EMOJI.default;
  for (const k of Object.keys(EMOJI)) if (cat.toLowerCase().includes(k)) return EMOJI[k];
  return EMOJI.default;
}
function imgUrl(name) {
  return `https://source.unsplash.com/400x300/?${encodeURIComponent(name + ' food dish')}`;
}

async function generateRecipes() {
  if (!state.geminiKey) { state.error = 'Please enter your Gemini API key above.'; render(); return; }
  if (state.ingredients.length === 0) return;
  state.loading = true; state.recipes = []; state.error = ''; render();

  const prompt = `Given these ingredients: ${state.ingredients.join(', ')}, suggest 6 recipes. Reply ONLY with a valid JSON array, no markdown, no explanation. Each object must have: title (string), category (one of: breakfast/lunch/dinner/dessert/snack/soup/salad), time (string like "25 min"), difficulty (Easy/Medium/Hard), ingredients (array of strings), steps (array of strings). Be concise.`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${state.geminiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    text = text.replace(/```json|```/g, '').trim();
    const s = text.indexOf('['), e = text.lastIndexOf(']');
    if (s !== -1 && e !== -1) text = text.slice(s, e+1);
    state.recipes = JSON.parse(text);
  } catch(e) {
    state.error = 'Something went wrong: ' + e.message;
    state.recipes = [];
  }
  state.loading = false; render();
}

function filteredRecipes() {
  if (state.activeFilter === 'all') return state.recipes;
  return state.recipes.filter(r => r.category && r.category.toLowerCase() === state.activeFilter);
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = (state.screen === 'signin' || state.screen === 'signup') ? renderAuth() : renderMain();
  if (state.modal) root.innerHTML += renderModal();
  attachEvents();
}

function renderAuth() {
  const isSignin = state.screen === 'signin';
  return `<div class="signin-screen"><div class="signin-card">
    <span class="logo">Reciply<span>.</span></span>
    <p>Turn your ingredients into delicious meals</p>
    ${state.authError ? `<div class="err">${state.authError}</div>` : ''}
    <input class="signin-input" id="auth-email" type="email" placeholder="Email" />
    <input class="signin-input" id="auth-pass" type="password" placeholder="Password" />
    ${!isSignin ? `<input class="signin-input" id="auth-name" type="text" placeholder="Your name" />` : ''}
    <button class="btn-signin" id="auth-submit">${isSignin ? 'Sign in' : 'Create account'}</button>
    <p class="signin-switch">${isSignin ? `No account? <a id="auth-switch">Sign up</a>` : `Already have one? <a id="auth-switch">Sign in</a>`}</p>
  </div></div>`;
}

function renderMain() {
  const filters = ['all', ...new Set(state.recipes.map(r => r.category).filter(Boolean))];
  const fr = filteredRecipes();
  const keySet = !!state.geminiKey;
  return `
  <nav class="nav">
    <div class="logo">Reciply<span>.</span></div>
    <div class="user-pill" id="sign-out-btn">
      <div class="avatar">${state.user?.name?.[0]?.toUpperCase() || 'U'}</div>
      ${state.user?.name || state.user?.email} · Sign out
    </div>
  </nav>
  <div class="hero">
    <h1>What's in your <em>fridge?</em></h1>
    <p>Add ingredients and we'll find the perfect recipes for you.</p>
  </div>
  <div class="input-wrap">
    <div class="key-row">
      <span class="key-label">Gemini API key</span>
      <input id="key-input" type="password" placeholder="Paste your key here..." value="${state.geminiKey}" style="flex:1;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--color-text-primary);font-family:'DM Sans',sans-serif;outline:none;" />
      <span class="key-status ${keySet ? 'set' : 'unset'}">${keySet ? 'Key saved' : 'No key'}</span>
    </div>
    <div class="ingredient-tags">
      ${state.ingredients.length === 0 ? '<span class="tag-placeholder">Add ingredients below...</span>' : state.ingredients.map((ing,i) => `<span class="tag">${ing}<button data-rm="${i}">×</button></span>`).join('')}
    </div>
    <div class="input-row">
      <input id="ing-input" type="text" placeholder="e.g. chicken, garlic, lemon..." />
      <button class="btn-add" id="add-btn">Add</button>
    </div>
    <button class="btn-generate" id="gen-btn" ${state.ingredients.length === 0 || state.loading ? 'disabled' : ''}>
      ${state.loading ? 'Finding recipes...' : 'Generate Recipes'}
    </button>
    ${state.error ? `<div class="error-banner">${state.error}</div>` : ''}
  </div>
  ${state.recipes.length > 0 ? `
    <div class="filter-row">
      ${filters.map(f => `<button class="filter-btn ${state.activeFilter===f?'active':''}" data-filter="${f}">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}
    </div>
    <div class="recipes-grid">
      ${fr.map((r,i) => `<div class="recipe-card" data-recipe="${i}">
        <img class="recipe-img" src="${imgUrl(r.title)}" alt="${r.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="recipe-img-placeholder" style="display:none">${getEmoji(r.category)}</div>
        <div class="recipe-body">
          <span class="recipe-tag">${r.category||'recipe'}</span>
          <div class="recipe-title">${r.title}</div>
          <div class="recipe-meta">${r.time||''} · ${r.difficulty||''}</div>
        </div>
      </div>`).join('')}
    </div>` : state.loading ? `<div class="loading">Finding delicious recipes...</div>` : ''}`;
}

function renderModal() {
  const r = state.modal;
  return `<div class="modal-bg" id="modal-bg"><div class="modal">
    <button class="modal-close" id="modal-close">Close</button>
    <img class="modal-img" src="${imgUrl(r.title)}" alt="${r.title}" onerror="this.style.display='none'" />
    <div class="modal-title">${r.title}</div>
    <div class="modal-meta">${r.category||''} · ${r.time||''} · ${r.difficulty||''}</div>
    <h3>Ingredients</h3><ul>${(r.ingredients||[]).map(i=>`<li>${i}</li>`).join('')}</ul>
    <h3>Steps</h3><ol>${(r.steps||[]).map(s=>`<li>${s}</li>`).join('')}</ol>
  </div></div>`;
}

function attachEvents() {
  if (state.screen === 'signin' || state.screen === 'signup') {
    document.getElementById('auth-submit')?.addEventListener('click', handleAuth);
    document.getElementById('auth-switch')?.addEventListener('click', () => { state.screen = state.screen==='signin'?'signup':'signin'; state.authError=''; render(); });
    return;
  }
  document.getElementById('sign-out-btn')?.addEventListener('click', () => { saveSession(null); state.user=null; state.screen='signin'; state.recipes=[]; state.ingredients=[]; render(); });
  document.getElementById('key-input')?.addEventListener('input', e => { state.geminiKey = e.target.value.trim(); localStorage.setItem(KEY_STORAGE, state.geminiKey); });
  const ingInput = document.getElementById('ing-input');
  document.getElementById('add-btn')?.addEventListener('click', addIngredient);
  ingInput?.addEventListener('keydown', e => { if(e.key==='Enter') addIngredient(); });
  document.getElementById('gen-btn')?.addEventListener('click', generateRecipes);
  document.querySelectorAll('[data-rm]').forEach(btn => btn.addEventListener('click', e => { state.ingredients.splice(+e.target.dataset.rm,1); render(); }));
  document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', e => { state.activeFilter=e.target.dataset.filter; render(); }));
  document.querySelectorAll('[data-recipe]').forEach(card => card.addEventListener('click', () => { state.modal=filteredRecipes()[+card.dataset.recipe]; render(); }));
  document.getElementById('modal-close')?.addEventListener('click', () => { state.modal=null; render(); });
  document.getElementById('modal-bg')?.addEventListener('click', e => { if(e.target.id==='modal-bg'){state.modal=null;render();} });
}

function addIngredient() {
  const val = document.getElementById('ing-input')?.value.trim();
  if (val && !state.ingredients.includes(val)) state.ingredients.push(val);
  render();
}

function handleAuth() {
  const email = document.getElementById('auth-email')?.value.trim();
  const pass = document.getElementById('auth-pass')?.value;
  const name = document.getElementById('auth-name')?.value.trim();
  const users = getUsers();
  if (!email||!pass) { state.authError='Please fill in all fields.'; render(); return; }
  if (state.screen==='signin') {
    if (!users[email]||users[email].pass!==pass) { state.authError='Invalid email or password.'; render(); return; }
    state.user={email,name:users[email].name};
  } else {
    if (!name) { state.authError='Please enter your name.'; render(); return; }
    if (users[email]) { state.authError='Account already exists. Sign in instead.'; render(); return; }
    users[email]={pass,name}; saveUsers(users);
    state.user={email,name};
  }
  saveSession(state.user); state.screen='main'; state.authError=''; render();
}

render();
</script>
